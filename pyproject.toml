[project]
authors = [{name = "xy1", email = "xy1@xx.com"}]
dependencies = []
name = "AutoWeb"
requires-python = "== 3.12.*"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
autoweb = { path = ".", editable = true }

[tool.pixi.dependencies]
selenium = ">=4.38.0,<5"
requests = ">=2.32.5,<3"
pydantic-settings = ">=2.11.0,<3"
pyinstaller = ">=6.16.0,<7"
aiohttp = ">=3.13.2,<4"
ujson = ">=5.11.0,<6"
psutil = "*"
ipykernel = ">=7.1.0,<8"
websockets = ">=15.0.1,<16"
pixi-pycharm = ">=0.0.10,<0.0.11"
playwright-python = ">=1.57.0,<2"

[tool.pixi.tasks]
web = "python -m autoweb.main"
server = "python -m autoweb.server"

[tool.pixi.tasks.build-web]
cmd = "pyinstaller --onefile --noconsole --icon assets\\ICO.ico --name web .\\src\\in.py"

[tool.pyright]
# 所有虚拟环境的父目录
venvPath = ".pixi/envs"

# 表示你当前使用的虚拟环境名称。
# 它是 venvPath 下的某个子目录名称。
venv = "default"
pythonVersion = "3.12"

[tool.ruff]
# https://beta.ruff.rs/docs/rules/
ignore = ["F401", "F841"]
